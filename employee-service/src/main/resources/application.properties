spring.application.name=employee-service
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

survey-api.base-url=http://localhost:3232

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer (Notification Service) has its own copy of EmployeeFlaggedEvent under a
# different package, so it can't trust a type header naming Employee Service's class.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Verifies JWTs issued by Authentication Service - same shared secret every
# service uses. No default: fails fast if unset, same convention as
# Notification Service.
jwt.secret=${JWT_SECRET}

notification.kafka.topic=employee.flagged

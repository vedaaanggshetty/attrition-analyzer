server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - unknown paths must fall back
    # to index.html instead of returning nginx's 404, otherwise a direct
    # load/refresh of e.g. /employees/42 would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

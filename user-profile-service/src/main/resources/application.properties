spring.application.name=user-profile-service
server.port=8082

# Loads the repo-root .env (DB creds, JWT_SECRET) as a properties source so
# `mvn spring-boot:run` works without manually exporting env vars. Optional so
# the service still starts if .env is absent (e.g. CI providing real env vars
# directly). Never committed - .env stays gitignored.
spring.config.import=optional:file:../.env[.properties]

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://${PROFILE_DB_HOST:localhost}:${PROFILE_DB_PORT:3309}/${PROFILE_DB_NAME:user_profile_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${PROFILE_DB_USERNAME}
spring.datasource.password=${PROFILE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Must match the JWT_SECRET Authentication Service is configured with -
# this service only validates tokens Authentication issues, it never signs
# its own. No default so the service fails fast if unset.
jwt.secret=${JWT_SECRET}

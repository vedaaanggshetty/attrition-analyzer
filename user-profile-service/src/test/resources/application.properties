spring.datasource.url=jdbc:mysql://${PROFILE_DB_HOST:localhost}:${PROFILE_DB_PORT:3306}/${PROFILE_DB_NAME:user_profile_db}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${PROFILE_DB_USERNAME}
spring.datasource.password=${PROFILE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=test-only-secret-value-not-for-production-use-1234567890

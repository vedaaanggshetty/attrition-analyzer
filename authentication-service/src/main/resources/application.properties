spring.application.name=authentication-service
server.port=8081

# Loads the repo-root .env (DB creds, JWT_SECRET, JWT_EXPIRATION_MS) as a
# properties source so `mvn spring-boot:run` works without manually exporting
# env vars. Optional so the service still starts if .env is absent (e.g. CI
# providing real env vars directly). Never committed - .env stays gitignored.
spring.config.import=optional:file:../.env[.properties]

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:3306}/${AUTH_DB_NAME:authentication_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# TEMPORARY: JWT config for the no-database login stage.
# jwt.secret has no default so the service fails fast if unset.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.application.name=api-gateway
server.port=8080

# Loads the repo-root .env (JWT_SECRET) as a properties source so
# `mvn spring-boot:run` works without manually exporting env vars. Optional
# so the service still starts if .env is absent. Never committed.
spring.config.import=optional:file:../.env[.properties]

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Must match the JWT_SECRET Authentication Service is configured with - the
# Gateway only validates tokens Authentication issues, it never signs its own.
# No default so the service fails fast if unset.
jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webmvc.routes[0].id=authentication-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://authentication-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=user-profile-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-profile-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=employee-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://employee-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/employees/**

spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/notifications/**

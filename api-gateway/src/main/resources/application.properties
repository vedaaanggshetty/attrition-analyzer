spring.application.name=api-gateway
server.port=8080

# Loads the repo-root .env (JWT_SECRET) as a properties source so
# `mvn spring-boot:run` works without manually exporting env vars. Optional
# so the service still starts if .env is absent. Never committed.
spring.config.import=optional:file:../.env[.properties]

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Must match the JWT_SECRET Authentication Service is configured with - the
# Gateway only validates tokens Authentication issues, it never signs its own.
# No default so the service fails fast if unset.
jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webmvc.routes[0].id=authentication-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://authentication-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=user-profile-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-profile-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=employee-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://employee-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/employees/**

spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/notifications/**

# Proxy each service's own OpenAPI document under /docs/<service>/v3/api-docs
# so the Gateway's own Swagger UI can aggregate all four into one dropdown -
# these are docs-only routes, not part of the business API surface above.
spring.cloud.gateway.server.webmvc.routes[4].id=authentication-service-docs
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://authentication-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/docs/authentication-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=RewritePath=/docs/authentication-service/v3/api-docs, /v3/api-docs

spring.cloud.gateway.server.webmvc.routes[5].id=user-profile-service-docs
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://user-profile-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/docs/user-profile-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=RewritePath=/docs/user-profile-service/v3/api-docs, /v3/api-docs

spring.cloud.gateway.server.webmvc.routes[6].id=employee-service-docs
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://employee-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/docs/employee-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=RewritePath=/docs/employee-service/v3/api-docs, /v3/api-docs

spring.cloud.gateway.server.webmvc.routes[7].id=notification-service-docs
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/docs/notification-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=RewritePath=/docs/notification-service/v3/api-docs, /v3/api-docs

# Aggregated Swagger UI: the Gateway has no REST endpoints of its own (it's a
# router), so its own local OpenAPI doc is essentially empty - the dropdown
# below is what actually matters. Each entry hits this same Gateway on a
# /docs/** route (proxied above) rather than the service's own port directly.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=API Gateway (Overview)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Authentication Service
springdoc.swagger-ui.urls[1].url=/docs/authentication-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=User Profile Service
springdoc.swagger-ui.urls[2].url=/docs/user-profile-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Employee Service
springdoc.swagger-ui.urls[3].url=/docs/employee-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Notification Service
springdoc.swagger-ui.urls[4].url=/docs/notification-service/v3/api-docs
# Load the overview first instead of whatever sorts first alphabetically -
# this is the actual "landing page" contributors see.
springdoc.swagger-ui.urls-primary-name=API Gateway (Overview)

# Actuator: only expose health over HTTP - same rationale/setup as every
# other service (see authentication-service's application.properties).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

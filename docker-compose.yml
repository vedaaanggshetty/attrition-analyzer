services:
  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - attrition-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Djwt.secret=${JWT_SECRET}
    depends_on:
      - discovery-service
    networks:
      - attrition-net

  employee-service:
    build:
      context: ./employee-service
    container_name: employee-service
    ports:
      - "8083:8083"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dsurvey-api.base-url=http://host.docker.internal:3232 -Dspring.kafka.bootstrap-servers=kafka:9092 -Djwt.secret=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - attrition-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - attrition-net

  # Single MySQL server hosting all three service databases (auth, profile,
  # notification) as separate schemas with separate per-service credentials.
  # docker/mysql/init-databases.sh runs once on first startup (empty volume)
  # to create the databases/users - see that file for the exact grants.
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PROFILE_DB_USERNAME: ${PROFILE_DB_USERNAME}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-db-data:/var/lib/mysql
      - ./docker/mysql/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - attrition-net

  authentication-service:
    build:
      context: ./authentication-service
    container_name: authentication-service
    ports:
      - "8081:8081"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dspring.datasource.url=jdbc:mysql://mysql-db:3306/authentication_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC -Dspring.datasource.username=${AUTH_DB_USERNAME} -Dspring.datasource.password=${AUTH_DB_PASSWORD} -Djwt.secret=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
    networks:
      - attrition-net

  user-profile-service:
    build:
      context: ./user-profile-service
    container_name: user-profile-service
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dspring.datasource.url=jdbc:mysql://mysql-db:3306/user_profile_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC -Dspring.datasource.username=${PROFILE_DB_USERNAME} -Dspring.datasource.password=${PROFILE_DB_PASSWORD} -Djwt.secret=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
    networks:
      - attrition-net

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dspring.datasource.url=jdbc:mysql://mysql-db:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC -Dspring.datasource.username=${NOTIFICATION_DB_USERNAME} -Dspring.datasource.password=${NOTIFICATION_DB_PASSWORD} -Djwt.secret=${JWT_SECRET} -Dspring.kafka.bootstrap-servers=kafka:9092
    depends_on:
      discovery-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - attrition-net

  # Static build served by nginx. The BROWSER (not this container) talks to
  # the Gateway, so VITE_API_BASE_URL must be a host-reachable address, never
  # a Docker-internal hostname like "api-gateway" - it defaults to
  # http://localhost:8080 (the Gateway's host-mapped port) unless overridden.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - attrition-net

networks:
  attrition-net:
    driver: bridge

volumes:
  mysql-db-data:

services:
  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - attrition-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Djwt.secret=${JWT_SECRET}
    depends_on:
      - discovery-service
    networks:
      - attrition-net

  employee-service:
    build:
      context: ./employee-service
    container_name: employee-service
    ports:
      - "8083:8083"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dsurvey-api.base-url=http://host.docker.internal:3232 -Dspring.kafka.bootstrap-servers=kafka:9092 -Djwt.secret=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - attrition-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - attrition-net

  authentication-db:
    image: mysql:8.0
    container_name: authentication-db
    environment:
      MYSQL_DATABASE: authentication_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${AUTH_DB_USERNAME}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - authentication-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - attrition-net

  authentication-service:
    build:
      context: ./authentication-service
    container_name: authentication-service
    ports:
      - "8081:8081"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dspring.datasource.url=jdbc:mysql://authentication-db:3306/authentication_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC -Dspring.datasource.username=${AUTH_DB_USERNAME} -Dspring.datasource.password=${AUTH_DB_PASSWORD} -Djwt.secret=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_started
      authentication-db:
        condition: service_healthy
    networks:
      - attrition-net

  user-profile-db:
    image: mysql:8.0
    container_name: user-profile-db
    environment:
      MYSQL_DATABASE: user_profile_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${PROFILE_DB_USERNAME}
      MYSQL_PASSWORD: ${PROFILE_DB_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - user-profile-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - attrition-net

  user-profile-service:
    build:
      context: ./user-profile-service
    container_name: user-profile-service
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dspring.datasource.url=jdbc:mysql://user-profile-db:3306/user_profile_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC -Dspring.datasource.username=${PROFILE_DB_USERNAME} -Dspring.datasource.password=${PROFILE_DB_PASSWORD} -Djwt.secret=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_started
      user-profile-db:
        condition: service_healthy
    networks:
      - attrition-net

  notification-db:
    image: mysql:8.0
    container_name: notification-db
    environment:
      MYSQL_DATABASE: notification_db
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_DB_ROOT_PASSWORD}
      MYSQL_USER: ${NOTIFICATION_DB_USERNAME}
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - notification-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NOTIFICATION_DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - attrition-net

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      JAVA_OPTS: >-
        -Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/ -Dspring.datasource.url=jdbc:mysql://notification-db:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC -Dspring.datasource.username=${NOTIFICATION_DB_USERNAME} -Dspring.datasource.password=${NOTIFICATION_DB_PASSWORD} -Djwt.secret=${JWT_SECRET} -Dspring.kafka.bootstrap-servers=kafka:9092
    depends_on:
      discovery-service:
        condition: service_started
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - attrition-net

networks:
  attrition-net:
    driver: bridge

volumes:
  authentication-db-data:
  user-profile-db-data:
  notification-db-data:
